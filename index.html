<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizMentor AI — Platform Konsultan Bisnis Digital Berbasis AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                brand: {
                    50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                    300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                    600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af',
                    900: '#1e3a8a',
                }
            },
            fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] }
        }
    }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
[x-cloak] { display: none !important; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #f1f5f9; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
.skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: skeleton 1.5s ease-in-out infinite; }
@keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.gantt-bar { background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 6px; height: 28px; position: relative; }
.swatch { width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; cursor: pointer; }
.swatch:hover { transform: scale(1.1); }
@media print { aside, header, .no-print { display: none !important; } main { padding: 0 !important; } body { background: white !important; } }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased flex flex-col" x-data="bizMentorApp()" x-init="init()" x-cloak>

<!-- TOAST -->
<div aria-live="polite" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
        <div class="pointer-events-auto flex items-center p-4 rounded-xl shadow-lg border text-sm font-medium"
             :class="{
                'bg-emerald-50 border-emerald-200 text-emerald-800': toast.type === 'success',
                'bg-blue-50 border-blue-200 text-blue-800': toast.type === 'info',
                'bg-amber-50 border-amber-200 text-amber-800': toast.type === 'warning',
                'bg-rose-50 border-rose-200 text-rose-800': toast.type === 'error'
             }">
            <i class="mr-3 text-lg" :class="{
                'fas fa-check-circle text-emerald-500': toast.type === 'success',
                'fas fa-info-circle text-blue-500': toast.type === 'info',
                'fas fa-exclamation-triangle text-amber-500': toast.type === 'warning',
                'fas fa-times-circle text-rose-500': toast.type === 'error'
             }"></i>
            <span x-text="toast.message"></span>
        </div>
    </template>
</div>

<!-- AI LOADING OVERLAY -->
<div x-show="aiLoading" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center shadow-2xl">
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-tr from-brand-600 to-emerald-500 flex items-center justify-center text-white">
            <i class="fas fa-wand-magic-sparkles text-3xl animate-pulse"></i>
        </div>
        <h3 class="text-xl font-extrabold text-slate-900 mb-2">AI Sedang Menganalisis</h3>
        <p class="text-sm text-slate-500 mb-6" x-text="aiLoadingMessage"></p>
        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-brand-600 to-emerald-500 h-full rounded-full animate-pulse" style="width: 70%"></div>
        </div>
        <p class="text-xs text-slate-400 mt-4">
            <i class="fas fa-robot mr-1"></i>
            Provider: <span class="font-bold uppercase" x-text="settings.defaultProvider"></span>
        </p>
    </div>
</div>

<!-- LANDING PAGE -->
<template x-if="currentView === 'landing'">
    <div class="min-h-full flex flex-col bg-white">
        <header class="border-b border-slate-100 sticky top-0 bg-white/80 backdrop-blur-md z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-500 flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-brain text-xl"></i>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900">BizMentor <span class="text-brand-600">AI</span></span>
                </div>
                <div class="flex items-center space-x-4">
                    <button @click="goTo('onboarding')" class="text-sm font-semibold text-slate-600 hover:text-brand-600 transition">Masuk / Setup</button>
                    <button @click="goTo('onboarding')" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white font-semibold shadow-lg hover:bg-brand-700 transition">
                        Mulai Gratis <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </header>
        <section class="relative overflow-hidden pt-20 pb-24 lg:pt-32 lg:pb-36 bg-gradient-to-b from-slate-50 via-white to-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <div class="inline-flex items-center px-3.5 py-1.5 rounded-full bg-brand-50 border border-brand-100 text-brand-700 text-xs font-semibold mb-6">
                    <i class="fas fa-sparkles mr-2 text-brand-500"></i> Didukung Gemini AI & Grok AI Engine
                </div>
                <h1 class="text-4xl sm:text-6xl font-extrabold text-slate-900 tracking-tight max-w-4xl mx-auto leading-tight">
                    Konsultan Bisnis AI Pintar untuk <span class="bg-gradient-to-r from-brand-600 to-emerald-600 bg-clip-text text-transparent">UMKM & Calon Pengusaha</span>
                </h1>
                <p class="mt-6 text-lg sm:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
                    Panduan terstruktur dari diagnosis masalah, strategi bisnis, perumusan produk & branding, proyeksi keuangan, hingga roadmap eksekusi 12 bulan.
                </p>
                <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
                    <button @click="goTo('onboarding')" class="px-8 py-4 rounded-xl bg-brand-600 text-white font-bold shadow-xl hover:bg-brand-700 transition">
                        Mulai Bangun Bisnis <i class="fas fa-rocket ml-2"></i>
                    </button>
                    <button @click="loadDemoData()" class="px-8 py-4 rounded-xl bg-white border border-slate-200 text-slate-700 font-bold shadow-sm hover:bg-slate-50 transition">
                        <i class="fas fa-bolt text-amber-500 mr-2"></i> Muat Data Contoh
                    </button>
                </div>
                <div class="grid md:grid-cols-3 gap-8 mt-24 text-left">
                    <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-xl shadow-slate-100">
                        <div class="w-12 h-12 rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center text-xl mb-6"><i class="fas fa-stethoscope"></i></div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">Diagnosis & Validasi</h3>
                        <p class="text-slate-600 text-sm leading-relaxed">Analisis PESTEL, peta kompetitor, dan wawancara pelanggan berbasis Mom Test.</p>
                    </div>
                    <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-xl shadow-slate-100">
                        <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mb-6"><i class="fas fa-chess"></i></div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">Strategi & BMC</h3>
                        <p class="text-slate-600 text-sm leading-relaxed">STP, VPC, BMC 9 blok, SWOT, dan SOAR secara sistematis.</p>
                    </div>
                    <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-xl shadow-slate-100">
                        <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl mb-6"><i class="fas fa-chart-line"></i></div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">Eksekusi & Keuangan</h3>
                        <p class="text-slate-600 text-sm leading-relaxed">Unit economics, proyeksi P&L, risk register, dan roadmap 12 bulan.</p>
                    </div>
                </div>
            </div>
        </section>
        <footer class="bg-slate-900 text-slate-400 py-12 mt-auto">
            <div class="max-w-7xl mx-auto px-4 text-center text-sm">
                <p>&copy; 2026 BizMentor AI. Dibangun untuk kemajuan UMKM Indonesia.</p>
            </div>
        </footer>
    </div>
</template>

<!-- ONBOARDING -->
<template x-if="currentView === 'onboarding'">
    <div class="min-h-full bg-slate-100 flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl border border-slate-200 overflow-hidden p-8">
            <div class="flex items-center justify-between mb-8">
                <template x-for="step in [1,2,3,4]" :key="step">
                    <div class="flex items-center flex-1">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm transition"
                             :class="onboardingStep >= step ? 'bg-brand-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'">
                            <i class="fas fa-check" x-show="onboardingStep > step"></i>
                            <span x-show="onboardingStep <= step" x-text="step"></span>
                        </div>
                        <div x-show="step < 4" class="flex-1 h-1 mx-2 rounded-full transition"
                             :class="onboardingStep > step ? 'bg-brand-600' : 'bg-slate-200'"></div>
                    </div>
                </template>
            </div>
            <div class="mb-8 pb-4 border-b border-slate-100">
                <span class="text-xs font-bold uppercase tracking-wider text-brand-600">Onboarding</span>
                <h2 class="text-2xl font-extrabold text-slate-900"
                    x-text="{1:'Pilih Status Bisnis',2:'Pilih Industri',3:'Konfigurasi AI Engine',4:'Konfirmasi & Mulai'}[onboardingStep]"></h2>
            </div>

            <!-- Step 1 -->
            <div x-show="onboardingStep === 1" class="space-y-6">
                <p class="text-slate-600">Di mana posisi bisnis Anda saat ini?</p>
                <div class="grid sm:grid-cols-2 gap-4">
                    <label class="border-2 rounded-2xl p-6 flex flex-col cursor-pointer transition hover:border-brand-500"
                           :class="formData.profile.userType === 'new' ? 'border-brand-600 bg-brand-50/50' : 'border-slate-200'">
                        <input type="radio" name="userType" value="new" x-model="formData.profile.userType" class="hidden">
                        <i class="fas fa-seedling text-3xl text-brand-600 mb-4"></i>
                        <span class="font-bold text-slate-900 text-lg mb-1">Saya baru mau mulai</span>
                        <span class="text-slate-500 text-sm">Punya ide, ingin divalidasi dan dibangun dari nol.</span>
                    </label>
                    <label class="border-2 rounded-2xl p-6 flex flex-col cursor-pointer transition hover:border-brand-500"
                           :class="formData.profile.userType === 'existing' ? 'border-brand-600 bg-brand-50/50' : 'border-slate-200'">
                        <input type="radio" name="userType" value="existing" x-model="formData.profile.userType" class="hidden">
                        <i class="fas fa-store text-3xl text-emerald-600 mb-4"></i>
                        <span class="font-bold text-slate-900 text-lg mb-1">Bisnis sudah jalan</span>
                        <span class="text-slate-500 text-sm">UMKM berjalan, ingin scale-up atau perbaiki profit.</span>
                    </label>
                </div>
                <div class="flex justify-end pt-4">
                    <button @click="nextOnboarding(1, formData.profile.userType, 'Pilih salah satu tipe user!')"
                            class="px-6 py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg hover:bg-brand-700 transition">
                        Selanjutnya <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Step 2 -->
            <div x-show="onboardingStep === 2" class="space-y-6">
                <p class="text-slate-600">Pilih sektor industri & beri nama bisnis Anda:</p>
                <div class="grid sm:grid-cols-2 gap-3 max-h-64 overflow-y-auto pr-1">
                    <template x-for="ind in industries" :key="ind">
                        <button type="button" @click="formData.profile.industry = ind"
                                class="p-4 rounded-xl border text-left transition font-semibold text-sm flex items-center justify-between"
                                :class="formData.profile.industry === ind ? 'border-brand-600 bg-brand-50 text-brand-700' : 'border-slate-200 text-slate-700 hover:bg-slate-50'">
                            <span x-text="ind"></span>
                            <i class="fas fa-check text-brand-600" x-show="formData.profile.industry === ind"></i>
                        </button>
                    </template>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nama Bisnis / Ide Bisnis</label>
                    <input type="text" x-model="formData.profile.businessName" placeholder="Contoh: Kopi Senja Nusantara"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div class="flex justify-between pt-4">
                    <button @click="onboardingStep--" class="px-6 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Kembali</button>
                    <button @click="nextOnboarding(2, formData.profile.industry && formData.profile.businessName, 'Lengkapi industri dan nama bisnis!')"
                            class="px-6 py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg hover:bg-brand-700 transition">
                        Selanjutnya <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Step 3 -->
            <div x-show="onboardingStep === 3" class="space-y-6">
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-800 leading-relaxed">
                    <i class="fas fa-shield-alt text-amber-600 mr-1"></i>
                    <strong>Opsional:</strong> Masukkan API Key untuk analisis AI cerdas. Jika dilewati, aplikasi berjalan dalam <strong>mode demo</strong>.
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Gemini API Key <span class="text-slate-400 font-normal">(opsional)</span></label>
                    <div class="relative">
                        <input :type="showGeminiKey ? 'text' : 'password'" x-model="settings.geminiKey"
                               class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 font-mono text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="AIzaSy...">
                        <button type="button" @click="showGeminiKey = !showGeminiKey" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
                            <i class="fas" :class="showGeminiKey ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Grok API Key <span class="text-slate-400 font-normal">(opsional)</span></label>
                    <div class="relative">
                        <input :type="showGrokKey ? 'text' : 'password'" x-model="settings.grokKey"
                               class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 font-mono text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="xai-...">
                        <button type="button" @click="showGrokKey = !showGrokKey" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
                            <i class="fas" :class="showGrokKey ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Default AI Provider</label>
                    <select x-model="settings.defaultProvider" class="w-full p-3 border rounded-xl text-sm bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <option value="gemini">Google Gemini AI</option>
                        <option value="grok">xAI Grok</option>
                    </select>
                </div>
                <div class="flex justify-between pt-4">
                    <button @click="onboardingStep--" class="px-6 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Kembali</button>
                    <button @click="onboardingStep++" class="px-6 py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg hover:bg-brand-700 transition">Selanjutnya <i class="fas fa-arrow-right ml-2"></i></button>
                </div>
            </div>

            <!-- Step 4 -->
            <div x-show="onboardingStep === 4" class="space-y-6 text-center py-6">
                <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                    <i class="fas fa-check"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Semua Siap, <span x-text="formData.profile.businessName"></span>!</h3>
                <p class="text-slate-600 max-w-md mx-auto">Profil bisnis Anda telah dikonfigurasi.</p>
                <div class="flex justify-center gap-3 pt-4">
                    <button @click="onboardingStep--" class="px-6 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Kembali</button>
                    <button @click="finishOnboarding()" class="px-8 py-4 bg-gradient-to-r from-brand-600 to-emerald-600 text-white font-extrabold rounded-2xl shadow-xl hover:opacity-95 transition">
                        Masuk ke Dashboard <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- MAIN APP LAYOUT -->
<template x-if="currentView !== 'landing' && currentView !== 'onboarding'">
    <div class="h-full flex overflow-hidden">
        <div x-show="sidebarOpen" x-cloak @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/50 z-20 lg:hidden"></div>
        <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col z-30 transition-transform duration-300 fixed inset-y-0 left-0 lg:static"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
            <div class="h-20 flex items-center px-6 border-b border-slate-800 justify-between">
                <div class="flex items-center space-x-3 cursor-pointer" @click="goTo('dashboard')">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-500 flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="min-w-0">
                        <span class="font-extrabold text-white text-base tracking-tight block">BizMentor <span class="text-brand-400">AI</span></span>
                        <span class="text-xs text-slate-400 truncate max-w-[130px] block" x-text="formData.profile.businessName || 'Bisnis Baru'"></span>
                    </div>
                </div>
                <button @click="sidebarOpen = false" class="lg:hidden text-slate-400 hover:text-white"><i class="fas fa-times text-lg"></i></button>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <template x-for="item in navItems" :key="item.id">
                    <button @click="goTo(item.id); sidebarOpen = false"
                            class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm transition"
                            :class="currentView === item.id ? 'bg-brand-600 text-white shadow-lg font-bold' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'">
                        <div class="flex items-center space-x-3">
                            <i :class="item.icon" class="text-base w-5 text-center"></i>
                            <span x-text="item.label"></span>
                        </div>
                        <span class="w-2 h-2 rounded-full"
                              :class="{
                                  'bg-emerald-400': item.status === 'completed',
                                  'bg-amber-400': item.status === 'in-progress',
                                  'bg-slate-600': item.status === 'not-started'
                              }"></span>
                    </button>
                </template>
            </nav>
            <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3 min-w-0">
                    <div class="w-10 h-10 rounded-full bg-brand-700 flex items-center justify-center text-white font-bold text-sm shrink-0">
                        <span x-text="formData.profile.businessName ? formData.profile.businessName.charAt(0).toUpperCase() : 'B'"></span>
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-bold text-white truncate" x-text="formData.profile.businessName || 'Bisnis Anda'"></p>
                        <p class="text-xs text-slate-400 truncate" x-text="formData.profile.industry || 'Umum'"></p>
                    </div>
                </div>
                <button @click="goTo('settings')" class="text-slate-400 hover:text-white p-2 shrink-0"><i class="fas fa-cog"></i></button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">
            <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 z-20 shrink-0">
                <div class="flex items-center space-x-4 min-w-0">
                    <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden text-slate-600 hover:text-slate-900 text-xl"><i class="fas fa-bars"></i></button>
                    <div class="min-w-0">
                        <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 truncate" x-text="getCurrentViewTitle()"></h1>
                        <p class="text-xs text-slate-500 hidden sm:block">Platform Konsultan Bisnis Digital</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 sm:space-x-6">
                    <div class="hidden md:flex items-center space-x-3 bg-slate-100 px-4 py-2 rounded-xl">
                        <span class="text-xs font-bold text-slate-600">Progress:</span>
                        <div class="w-32 bg-slate-200 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full rounded-full transition-all duration-500" :style="`width: ${getGlobalProgress()}%`"></div>
                        </div>
                        <span class="text-xs font-extrabold text-slate-800" x-text="getGlobalProgress() + '%'"></span>
                    </div>
                    <button @click="runAIGeneratorGlobal()" class="px-3 sm:px-4 py-2 bg-gradient-to-r from-brand-600 to-emerald-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md hover:opacity-95 transition flex items-center">
                        <i class="fas fa-wand-magic-sparkles sm:mr-2"></i>
                        <span class="hidden sm:inline">Analisis AI</span>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 sm:p-8">

                font: 'Plus Jakarta Sans', logo: ''

                checklist: [{ label: '', done: false }]
            },
            report: { summary: '', generatedAt: '' }
        },

        get navItems() {
            return [
                { id: 'dashboard', label: 'Dashboard', icon: 'fas fa-home', status: this.getStatus('dashboard') },
                { id: 'diagnosis', label: 'Diagnosis', icon: 'fas fa-stethoscope', status: this.getStatus('diagnosis') },
                { id: 'strategi', label: 'Strategi', icon: 'fas fa-chess', status: this.getStatus('strategi') },
                { id: 'branding', label: 'Produk & Branding', icon: 'fas fa-palette', status: this.getStatus('branding') },
                { id: 'perencanaan', label: 'Perencanaan', icon: 'fas fa-calculator', status: this.getStatus('perencanaan') },
                { id: 'eksekusi', label: 'Eksekusi', icon: 'fas fa-rocket', status: this.getStatus('eksekusi') },
                { id: 'report', label: 'Report & Export', icon: 'fas fa-file-alt', status: 'not-started' },
                { id: 'settings', label: 'Pengaturan', icon: 'fas fa-cog', status: 'not-started' }
            ];
        },

        get bmcBlocks() {
            return [
                { key: 'partners', label: 'Key Partners', ph: 'Supplier, vendor...' },
                { key: 'activities', label: 'Key Activities', ph: 'Produksi, marketing...' },
                { key: 'value', label: 'Value Propositions', ph: 'Keunggulan unik...' },
                { key: 'relationships', label: 'Customer Relationships', ph: 'Loyalty program...' },
                { key: 'segments', label: 'Customer Segments', ph: 'Target market...' },
                { key: 'resources', label: 'Key Resources', ph: 'Tim, aset, paten...' },
                { key: 'channels', label: 'Channels', ph: 'Sosmed, marketplace...' },
                { key: 'costs', label: 'Cost Structure', ph: 'Gaji, bahan baku...' },
                { key: 'revenue', label: 'Revenue Streams', ph: 'Penjualan, subscription...' }
            ];
        },

        get phasesList() {
            return [
                { id: 'diagnosis', title: 'Diagnosis', desc: 'PESTEL, kompetitor, empathy', route: 'diagnosis', completed: this.isPhaseComplete('diagnosis') },
                { id: 'strategi', title: 'Strategi', desc: 'STP, VPC, BMC, SWOT/SOAR', route: 'strategi', completed: this.isPhaseComplete('strategi') },
                { id: 'branding', title: 'Branding', desc: 'Identitas & portofolio produk', route: 'branding', completed: this.isPhaseComplete('branding') },
                { id: 'perencanaan', title: 'Finansial', desc: 'Unit economics & P&L', route: 'perencanaan', completed: this.isPhaseComplete('perencanaan') },
                { id: 'eksekusi', title: 'Eksekusi', desc: 'Roadmap & KPI 12 bulan', route: 'eksekusi', completed: this.isPhaseComplete('eksekusi') }
            ];
        },

        init() {
            const hash = window.location.hash.replace('#/', '');
            const savedProfile = localStorage.getItem('bizmentor_profile');
            const savedSettings = localStorage.getItem('bizmentor_settings');
            const savedData = localStorage.getItem('bizmentor_data');

            if (savedSettings) { try { this.settings = { ...this.settings, ...JSON.parse(savedSettings) }; } catch (e) {} }
            if (savedData) { try { this.formData = this.deepMerge(this.formData, JSON.parse(savedData)); } catch (e) {} }
            if (savedProfile) {
                this.formData.profile = JSON.parse(savedProfile);
                this.currentView = hash || 'dashboard';
            } else {
                this.currentView = 'landing';
            }

            window.addEventListener('hashchange', () => {
                const newHash = window.location.hash.replace('#/', '');
                if (newHash) this.currentView = newHash;
            });
        },

        deepMerge(target, source) {
            const out = { ...target };
            for (const key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    out[key] = this.deepMerge(target[key] || {}, source[key]);
                } else {
                    out[key] = source[key];
                }
            }
            return out;
        },

        goTo(view) {
            this.currentView = view;
            window.location.hash = `#/${view}`;
            window.scrollTo(0, 0);
        },

        getCurrentViewTitle() {
            const titles = {
                dashboard: 'Dashboard Utama',
                diagnosis: 'Diagnosis & Analisis Pasar',
                strategi: 'Strategi & Model Bisnis',
                branding: 'Produk & Brand Identity',
                perencanaan: 'Perencanaan Finansial',
                eksekusi: 'Eksekusi & Roadmap',
                report: 'Laporan Eksekutif',
                settings: 'Pengaturan Sistem'
            };
            return titles[this.currentView] || 'BizMentor AI';
        },

        getPhaseLabel(view) {
            const labels = { diagnosis: 'Diagnosis', strategi: 'Strategi', branding: 'Branding', perencanaan: 'Finansial', eksekusi: 'Eksekusi' };
            return labels[view] || 'Dashboard';
        },

        getNextRecommendedPhase() {
            if (!this.isPhaseComplete('diagnosis')) return 'diagnosis';
            if (!this.isPhaseComplete('strategi')) return 'strategi';
            if (!this.isPhaseComplete('branding')) return 'branding';
            if (!this.isPhaseComplete('perencanaan')) return 'perencanaan';
            if (!this.isPhaseComplete('eksekusi')) return 'eksekusi';
            return 'report';
        },

        isPhaseComplete(phase) {
            const d = this.formData;
            switch (phase) {
                case 'diagnosis': return !!(d.diagnosis.pestel.political && d.diagnosis.pestel.social);
                case 'strategi': return !!(d.strategy.bmc.value && d.strategy.stp.statement);
                case 'branding': return !!(d.branding.tagline && d.branding.voice);
                case 'perencanaan': return !!(d.financial.cac && d.financial.bep);
                case 'eksekusi': return d.execution.roadmap.some(r => r.title);
                default: return false;
            }
        },

        getStatus(view) {
            if (view === 'dashboard' || view === 'settings' || view === 'report') return 'not-started';
            if (this.isPhaseComplete(view)) return 'completed';
            return 'not-started';
        },

        getGlobalProgress() {
            const phases = ['diagnosis', 'strategi', 'branding', 'perencanaan', 'eksekusi'];
            const done = phases.filter(p => this.isPhaseComplete(p)).length;
            return Math.round((done / phases.length) * 100);
        },

        getRecentActivity() {
            const acts = [];
            const d = this.formData;
            if (d.diagnosis.pestel.political) acts.push({ label: 'Mengisi PESTEL Analysis', icon: 'fas fa-globe', time: 'Baru saja' });
            if (d.strategy.stp.statement) acts.push({ label: 'Menyusun STP', icon: 'fas fa-bullseye', time: 'Baru saja' });
            if (d.strategy.bmc.value) acts.push({ label: 'Mengisi Business Model Canvas', icon: 'fas fa-th-large', time: 'Baru saja' });
            if (d.branding.tagline) acts.push({ label: 'Membuat Brand Identity', icon: 'fas fa-palette', time: 'Baru saja' });
            if (d.financial.bep) acts.push({ label: 'Menghitung Unit Economics', icon: 'fas fa-calculator', time: 'Baru saja' });
            return acts.slice(0, 5);
        },

        nextOnboarding(step, condition, msg) {
            if (condition) this.onboardingStep++;
            else this.showToast(msg, 'warning');
        },

        finishOnboarding() {
            localStorage.setItem('bizmentor_profile', JSON.stringify(this.formData.profile));
            this.saveSettings();
            this.saveData();
            this.goTo('dashboard');
            this.showToast('Onboarding selesai! Selamat datang.', 'success');
        },

        saveData() { localStorage.setItem('bizmentor_data', JSON.stringify(this.formData)); },
        saveSettings() {
            localStorage.setItem('bizmentor_settings', JSON.stringify(this.settings));
            this.showToast('Pengaturan disimpan!', 'success');
        },

        resetData() {
            if (confirm('Yakin ingin mereset seluruh data bisnis? Tindakan ini tidak bisa dibatalkan.')) {
                localStorage.clear();
                window.location.hash = '';
                location.reload();
            }
        },

        exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                profile: this.formData.profile, diagnosis: this.formData.diagnosis,
                strategy: this.formData.strategy, branding: this.formData.branding,
                financial: this.formData.financial, execution: this.formData.execution,
                report: this.formData.report, exportedAt: new Date().toISOString()
            }, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `BizMentor_${this.formData.profile.businessName || 'Bisnis'}_${Date.now()}.json`);
            document.body.appendChild(a);
            a.click();
            a.remove();
            this.showToast('File backup berhasil diunduh!', 'success');
        },

        addCompetitor() { this.formData.diagnosis.competitors.push({ name: '', price: '', strength: '', weakness: '' }); },

        showToast(message, type = 'success') {
            const id = Date.now() + Math.random();
            this.toasts.push({ id, message, type });
            setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 4000);
        },

        async callAI(prompt, type) {
            this.aiLoading = true;
            this.aiLoadingMessage = `Menghasilkan ${type} dengan ${this.settings.defaultProvider.toUpperCase()}...`;
            await new Promise(r => setTimeout(r, 1500));
            const result = await MockAI.generate(type, this.formData, this.settings.defaultProvider);
            this.aiLoading = false;
            return result;
        },

        async generateAIContent(type) {
            try {
                const result = await this.callAI('', type);
                this.applyAIResult(type, result);
                this.saveData();
                this.showToast(`Analisis ${type.toUpperCase()} berhasil diterapkan!`, 'success');
            } catch (err) {
                this.aiLoading = false;
                this.showToast(`Gagal generate ${type}: ${err.message}`, 'error');
            }
        },

        applyAIResult(type, result) {
            const d = this.formData;
            switch (type) {
                case 'pestel': d.diagnosis.pestel = { ...d.diagnosis.pestel, ...result }; break;
                case 'competitor':
                    if (result.competitors) d.diagnosis.competitors = result.competitors;
                    if (result.gap) d.diagnosis.competitorGap = result.gap;
                    break;
                case 'empathy': d.diagnosis.empathy = { ...d.diagnosis.empathy, ...result }; break;
                case 'stp': d.strategy.stp = { ...d.strategy.stp, ...result }; break;
                case 'vpc': d.strategy.vpc = { ...d.strategy.vpc, ...result }; break;
                case 'bmc': d.strategy.bmc = { ...d.strategy.bmc, ...result }; break;
                case 'swot': d.strategy.swot = { ...d.strategy.swot, ...result }; break;
                case 'soar': d.strategy.soar = { ...d.strategy.soar, ...result }; break;
                case 'portofolio':
                    if (result.bcg) d.strategy.bcg = { ...d.strategy.bcg, ...result.bcg };
                    if (result.ansoff) d.strategy.ansoff = { ...d.strategy.ansoff, ...result.ansoff };
                    if (result.kano) d.strategy.kano = { ...d.strategy.kano, ...result.kano };
                    break;
                case 'branding':
                    if (result.products) d.branding.products = result.products;
                    if (result.tagline) d.branding.tagline = result.tagline;
                    if (result.voice) d.branding.voice = result.voice;
                    if (result.personality) d.branding.personality = result.personality;
                    if (result.purpose) d.branding.purpose = result.purpose;
                    if (result.colors) d.branding.colors = result.colors;
                    if (result.font) d.branding.font = result.font;
                    if (result.logo) d.branding.logo = result.logo;
                    break;
                case 'financial':
                    if (result.cac) d.financial.cac = result.cac;
                    if (result.ltv) d.financial.ltv = result.ltv;
                    if (result.margin) d.financial.margin = result.margin;
                    if (result.bep) d.financial.bep = result.bep;
                    if (result.assumptions) d.financial.assumptions = result.assumptions;
                    break;
                case 'execution':
                    if (result.roadmap) d.execution.roadmap = result.roadmap;
                    if (result.kpi) d.execution.kpi = { ...d.execution.kpi, ...result.kpi };
                    if (result.checklist) d.execution.checklist = result.checklist;
                    break;
            }
        },

        async runAIGeneratorGlobal() {
            const phase = this.getNextRecommendedPhase();
            const map = { diagnosis: 'pestel', strategi: 'bmc', branding: 'branding', perencanaan: 'financial', eksekusi: 'execution', report: 'report' };
            if (phase === 'report') await this.generateExecutiveSummary();
            else await this.generateAIContent(map[phase]);
